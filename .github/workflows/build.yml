name: Build Eclipse ISO
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Liberar espaco
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
      - name: Construir ISO (Debian 12 em Docker)
        run: |
          docker run --rm --privileged -v "$PWD":/work -w /work debian:bookworm bash build-eclipse.sh
      - uses: actions/upload-artifact@v4
        with:
          name: eclipse-iso
          path: eclipse-os/eclipse.iso
          compression-level: 0
